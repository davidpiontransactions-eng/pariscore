name: Refresh FD Rankings

# Daily refresh of per-team championship stats from football-data.co.uk free
# CSVs (results incl. home/away corners HC/AC, goals, BTTS). Generates
# /public/data/fd/*.json with season-split team stats (overall/home/away) used
# by /api/football/rankings and the "Classements" sidebar widget.
#
# Note : la saison courante apparaît sur le site quand elle y est publiée —
# le scraper la prend automatiquement (skip gracieux sinon).
#
# Triggers:
#   - schedule: 04:45 UTC daily (after form refresh, before xG refresh)
#   - workflow_dispatch: manual trigger

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-fd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape football-data.co.uk CSVs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-rankings.txt

      - name: Scrape stats
        run: |
          mkdir -p public/data/fd
          python scripts/scrape_footballdata.py --all --output-dir public/data/fd

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/fd/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected fd changes:"
            git diff --stat -- public/data/fd/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fd/
          git commit -m "chore(data): refresh fd rankings [skip ci]"
          git push
