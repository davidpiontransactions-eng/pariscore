name: Refresh Form

# Daily auto-refresh of per-team recent form (Home/Away) from soccerstats.com
# formtable.asp. Scrapes all configured leagues and generates
# /public/data/form/*.json, then commits changes back to main.
#
# En début de saison, le corpus courant est trop sparse : le scraper cumule la
# FORME DE DEUX SAISONS. Il scrapes la saison courante (2026/27) ET la saison
# précédente (2025/26, convention d'URL `league=<slug>_2026`), puis les fusionne
# (priorité à la saison courante, complétée par la précédente jusqu'à 5 matchs).
# Pour les ligues sans saison précédente dispo (HTTP 500), repli sur la
# saison courante seule.
#
# Triggers:
#   - schedule: 04:30 UTC daily (just after the rankings refresh)
#   - workflow_dispatch: manual trigger

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug (blank = all)"
        type: string
        required: false
        default: ""

concurrency:
  group: refresh-form
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape form from soccerstats.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-rankings.txt

      - name: Scrape form
        id: scrape
        run: |
          mkdir -p public/data/form
          ARGS="--output-dir public/data/form"
          if [ -n "${{ inputs.league }}" ]; then
            ARGS="$ARGS --league ${{ inputs.league }}"
          else
            ARGS="$ARGS --all"
          fi
          python scripts/scrape_form.py $ARGS

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/form/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected form changes:"
            git diff --stat -- public/data/form/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/form/
          git commit -m "chore(data): refresh form [skip ci]"
          git push
