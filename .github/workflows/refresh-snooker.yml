name: Refresh Snooker

# Scrape quotidien des données snooker (FlashScore + Oddsportal NIO + CueTracker).
# Les scrapers Playwright sortent des JSON dans data/ — le workflow commite les changements.
#
# Triggers:
#   - schedule: 06:00 UTC daily (avant les matchs EU)
#   - workflow_dispatch: trigger manuel

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source à scraper (all, flashscore, oddsportal, cuetracker)"
        type: choice
        options:
          - all
          - flashscore
          - oddsportal
          - cuetracker
        default: all

concurrency:
  group: refresh-snooker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape snooker data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Scrape FlashScore
        if: inputs.source == 'all' || inputs.source == 'flashscore' || inputs.source == ''
        run: node scripts/scrape_flashscore_snooker.mjs

      - name: Scrape Oddsportal NIO
        if: inputs.source == 'all' || inputs.source == 'oddsportal' || inputs.source == ''
        run: node scripts/scrape_oddsportal_nio.mjs

      - name: Setup Python
        if: inputs.source == 'all' || inputs.source == 'cuetracker' || inputs.source == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: inputs.source == 'all' || inputs.source == 'cuetracker' || inputs.source == ''
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape CueTracker
        if: inputs.source == 'all' || inputs.source == 'cuetracker' || inputs.source == ''
        run: python scripts/scrape_cuetracker.py
        continue-on-error: true

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected snooker data changes:"
            git diff --stat -- data/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh snooker [skip ci]"
          git push
