<?xml version="1.0" encoding="UTF-8"?>
<!-- PariScore Header — Sports athlete with splash effect -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="athleteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00c853" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="headerClip">
      <rect width="400" height="60"/>
    </clipPath>
  </defs>

  <g clip-path="url(#headerClip)">
    <!-- Splash particles (ink effect) -->
    <g opacity="0.3">
      <!-- Large splash blobs -->
      <ellipse cx="320" cy="30" rx="45" ry="25" fill="url(#splashGrad)" filter="url(#blur)"/>
      <ellipse cx="350" cy="25" rx="30" ry="20" fill="url(#splashGrad)" filter="url(#blur)"/>
      <ellipse cx="370" cy="35" rx="25" ry="15" fill="url(#splashGrad)" filter="url(#blur)"/>
      
      <!-- Small splash dots -->
      <circle cx="290" cy="20" r="3" fill="#00e676" opacity="0.5"/>
      <circle cx="310" cy="45" r="2" fill="#00e676" opacity="0.4"/>
      <circle cx="340" cy="15" r="2.5" fill="#29b6f6" opacity="0.4"/>
      <circle cx="360" cy="50" r="2" fill="#00e676" opacity="0.3"/>
      <circle cx="380" cy="20" r="1.5" fill="#29b6f6" opacity="0.5"/>
      <circle cx="395" cy="40" r="2" fill="#00e676" opacity="0.4"/>
      
      <!-- Motion trail lines -->
      <path d="M 280 30 Q 320 28 360 32" stroke="#00e676" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M 290 35 Q 330 30 370 38" stroke="#29b6f6" stroke-width="0.8" fill="none" opacity="0.25"/>
      <path d="M 285 25 Q 325 22 365 28" stroke="#00e676" stroke-width="0.6" fill="none" opacity="0.2"/>
    </g>

    <!-- Soccer ball with motion -->
    <g transform="translate(280, 42)" opacity="0.6">
      <circle r="6" fill="white" opacity="0.8"/>
      <path d="M 0 -6 L -2 -2 M 0 -6 L 2 -2 M -5 -1 L 5 -1 M -4 3 L 4 3" stroke="#333" stroke-width="0.8" fill="none"/>
      <!-- Motion trail -->
      <path d="M -8 0 Q -15 -2 -22 0" stroke="white" stroke-width="1" fill="none" opacity="0.3"/>
    </g>

    <!-- Main athlete — Running footballer silhouette -->
    <g transform="translate(330, 8)" filter="url(#glow)">
      <!-- Body core -->
      <path d="M 0 15 L -3 35 L 3 35 Z" fill="url(#athleteGrad)" opacity="0.9"/>
      
      <!-- Head -->
      <circle cx="0" cy="8" r="7" fill="url(#athleteGrad)" opacity="0.95"/>
      
      <!-- Left arm (back) -->
      <path d="M -2 18 L -18 22 L -22 18" stroke="url(#athleteGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Right arm (forward) -->
      <path d="M 2 18 L 16 12 L 22 8" stroke="url(#athleteGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Left leg (back) -->
      <path d="M -2 35 L -16 48 L -20 58" stroke="url(#athleteGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
      
      <!-- Right leg (forward) -->
      <path d="M 2 35 L 14 50 L 18 58" stroke="url(#athleteGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Jersey number -->
      <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="white" opacity="0.6">10</text>
    </g>

    <!-- Additional splash particles around athlete -->
    <g opacity="0.4">
      <circle cx="310" cy="15" r="1.5" fill="#00e676"/>
      <circle cx="355" cy="10" r="1" fill="#29b6f6"/>
      <circle cx="365" cy="55" r="1.5" fill="#00e676"/>
      <circle cx="345" cy="5" r="1" fill="#29b6f6"/>
      <circle cx="320" cy="50" r="1" fill="#00e676"/>
    </g>

    <!-- Speed lines -->
    <g stroke="url(#athleteGrad)" stroke-width="0.8" fill="none" opacity="0.25">
      <line x1="270" y1="20" x2="295" y2="20"/>
      <line x1="265" y1="30" x2="290" y2="30"/>
      <line x1="270" y1="40" x2="295" y2="40"/>
      <line x1="275" y1="50" x2="295" y2="50"/>
    </g>
  </g>
</svg>
