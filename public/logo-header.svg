<?xml version="1.0" encoding="UTF-8"?>
<!-- PariScore Header Logo — Compact version for navbar -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M 20 4 L 36 10 L 36 24 C 36 30 28 36 20 38 C 12 36 4 30 4 24 L 4 10 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.8"/>
  
  <!-- Trend arrow going up -->
  <path d="M 8 28 L 16 20 L 22 24 L 32 12" 
        fill="none" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 28 10 L 32 12 L 30 16" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Soccer ball (bottom left) -->
  <circle cx="10" cy="30" r="4" fill="white" opacity="0.9"/>
  <path d="M 10 26 L 8 28 M 10 26 L 12 28 M 7 30 L 13 30 M 8 32 L 12 32" 
        stroke="#333" stroke-width="0.8" fill="none"/>
  
  <!-- Tennis ball (top right) -->
  <circle cx="30" cy="16" r="3.5" fill="#c8e64c" opacity="0.9"/>
  <path d="M 27 14 A 3.5 3.5 0 0 1 33 18 M 27 18 A 3.5 3.5 0 0 0 33 14" 
        stroke="#a8c632" stroke-width="1" fill="none"/>
  
  <!-- Score badge -->
  <rect x="18" y="8" width="14" height="8" rx="2" fill="#0a101b" stroke="#00e676" stroke-width="1"/>
  <text x="25" y="14.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="6" fill="white">
    2<tspan fill="#00e676">-</tspan><tspan fill="#29b6f6">1</tspan>
  </text>
</svg>
