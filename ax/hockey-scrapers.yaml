# Pattern AX (google/ax) — scrapers hockey déclarés en manifestes uniques.
# Source de vérité : une Task YAML par scraper + Gateway egress allowlist.
# Quand AX/K8s dispo : `ax apply -f ax/hockey-scrapers.yaml`. En attendant,
# les CI/.bat/.bat-consommants lisent CE fichier comme contrat (hôtes + commandes).
# Schéma exact ax.io/v1alpha1 = évolutif (alpha) — adapter les clés au merge.
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: pariscore
spec:
  git:
    - repo: https://github.com/davidpiontransactions-eng/pariscore.git
      branch: main
---
apiVersion: ax.io/v1alpha1
kind: Gateway
metadata:
  name: hockey-sources
spec:
  # Allowlist egress — UNIQUEMENT les sources scrapées (network fencing)
  allowlist:
    - host: oddspedia.com
      proto: https
    - host: cdn.oddspedia.com
      proto: https
    - host: annabet.com
      proto: https
    - host: www.betexplorer.com
      proto: https
    - host: frozenpool.dobbersports.com
      proto: https
    - host: liguemagnus.com
      proto: https
    - host: www.eliteprospects.com
      proto: https
    - host: api-web.nhle.com
      proto: https
    - host: khl.shayy.workers.dev
      proto: https
    - host: sports.bzzoiro.com
      proto: https
    - host: vitibet.com
      proto: https
    - host: www.vitibet.com
      proto: https
    # Feed interne Flashscore — consommé par scripts/scrape-flashscore-handball.js
    # (et les scrapers tennis/cycling). ABSENT de l'allowlist jusqu'au
    # 2026-10-04 alors que le scraper en dépend : si le gateway fence la liste,
    # le cron handball échoue en silence et le snapshot reste figé (symptôme
    # observé : data/flashscore_handball.json bloqué au 2026-09-28).
    - host: 2.flashscore.ninja
      proto: https
    - host: localhost
      port: 8191
      note: FlareSolverr local (conteneur) pour WAF
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-oddspedia
spec:
  workspaces:
    - name: pariscore
      goal: "Calendrier + standings Magnus/KHL/NHL (JSON-LD, zéro dep)"
  command: node scripts/scrape-oddspedia-hockey.mjs
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-annabet
spec:
  workspaces:
    - name: pariscore
      goal: "H2H + odds 1X2 prematch (WAF — FlareSolverr + pacing)"
  command: node scripts/scrape-annabet-hockey-prematch.mjs
  retries: 2
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-betexplorer
spec:
  workspaces:
    - name: pariscore
      goal: "Odds 1X2 Ligue Magnus (Playwright + age gate)"
  command: node scripts/scrape-betexplorer-hockey.mjs
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-eliteprospects
spec:
  workspaces:
    - name: pariscore
      goal: "Standings + stats joueurs NHL/KHL/Magnus"
  command: node scripts/scrape-eliteprospects-hockey.mjs && node scripts/scrape-eliteprospects-player-stats.mjs
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-liguemagnus
spec:
  workspaces:
    - name: pariscore
      goal: "Stats officielles Synerglace (classement, individuelles, collectives)"
  command: node scripts/scrape-liguemagnus-stats.mjs
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: scrape-frozenpool
spec:
  workspaces:
    - name: pariscore
      goal: "Fixtures JSON + trios EV NHL (lambdas Poisson)"
  command: node scripts/scrape-frozenpool-nhl.mjs
  schedule: "0 5 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: handball-history-betexplorer
spec:
  workspaces:
    - name: pariscore
      goal: >-
        Historique de matchs TERMINÉS par ligue et par saison (2 saisons) pour
        les 9 ligues couvertes → table handball_match_history. Source unique
        possible : le feed Flashscore est plafonné à J-7 (vérifié : day=-8 et
        au-delà renvoient 0 octet) et Vitibet ne garde que la saison courante
        (vérifié). On n'utilise QUE les pages de saison BetExplorer
        /handball/{pays}/{ligue}/{ligue}-{saison}/results/ — chemin pur, donc
        AUTORISÉ par robots.txt. Les pages datées /results/?year=&month= sont
        INTERDITES (Disallow: /*?year=, /*?month=).
        Volume : 9 requêtes/jour (re-fetch de la saison en cours + diff par id)
        + 18 au backfill initial. Retry obligatoire : ~33 % d'ECONNRESET mesurés.
  command: node scripts/scrape-handball-history.mjs --seasons=2
  retries: 3
  # 00:00 heure de Paris (23:00 UTC) : le digest quotidien part sur des
  # résultats de la veille clos et consolidés.
  schedule: "0 23 * * *"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: vitibet-handball
spec:
  workspaces:
    - name: pariscore
      goal: "Quicktips handball J→J+3 (INDEX, probas 1/X/2, score prédit) → table vitibet_tips"
  command: node scripts/scrape-vitibet.js
  schedule:
    - "30 5 * * *"   # 05:30 UTC
    - "0 12 * * *"   # 12:00 UTC
